name: Mutation Testing

on:
  schedule:
    - cron: '0 15 * * 5'  # every Friday at 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:

    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - name: Setup JDK
      uses: ./.github/actions/setup-jdk
      with:
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - name: Mutation testing (Stryker4s)
      # The sbt plugin has no CLI options: a `--concurrency` flag makes sbt fail after Stryker ends.
      # set -o pipefail is required, because without it `| tee` hides a failing run.
      run: |
        set -o pipefail
        sbt pills/stryker | tee stryker-output.log
    - name: Report mutation score
      if: always()
      run: |
        {
          echo '## Mutation testing (Stryker4s)'
          echo '```'
          grep -E 'Mutation score|threshold' stryker-output.log || echo 'No score line found - see the full log or the uploaded report.'
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: stryker4s-report
        path: pills/target/stryker4s-report/**
        retention-days: 90
